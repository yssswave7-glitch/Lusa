<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lusa</title>
  <desc id="desc">Lusa logo with a purple-to-blue rounded square, subtle grid, white crescent and Lusa wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a92cff"/>
      <stop offset="0.48" stop-color="#7656ff"/>
      <stop offset="1" stop-color="#148dff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="none"/>
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="7"/>
    </pattern>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="385" cy="123" r="47" fill="white"/>
      <circle cx="363" cy="100" r="45" fill="black"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="48" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="48" fill="url(#grid)"/>
  <rect x="329" y="67" width="112" height="112" fill="#fff" mask="url(#crescent)"/>
  <text x="82" y="407" fill="#fff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="132" font-weight="400" letter-spacing="-7">Lusa</text>
</svg>
