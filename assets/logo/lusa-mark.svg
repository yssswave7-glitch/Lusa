<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lusa mark</title>
  <desc id="desc">Lusa purple-to-blue crescent logo mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a92cff"/>
      <stop offset="0.48" stop-color="#7656ff"/>
      <stop offset="1" stop-color="#148dff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="7"/>
    </pattern>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="290" cy="245" r="112" fill="white"/>
      <circle cx="237" cy="190" r="108" fill="black"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="48" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="48" fill="url(#grid)"/>
  <rect x="150" y="105" width="280" height="280" fill="#fff" mask="url(#crescent)"/>
</svg>
