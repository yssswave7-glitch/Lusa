name: Lusa CI / x64 builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64 (Debian 11 baseline)
            target: x86_64-unknown-linux-gnu
            artifact: lusa-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/lusa
            release_name: lusa-linux-x86_64
          - os: windows-2022
            label: Windows x64
            target: x86_64-pc-windows-msvc
            artifact: lusa-windows-x86_64
            binary: target/x86_64-pc-windows-msvc/release/lusa.exe
            release_name: lusa-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Linux release on Debian 11 baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work rust:1.90.0-bullseye bash -c 'apt-get update &&
              apt-get install --yes --no-install-recommends cmake &&
              cargo build --locked --release --target x86_64-unknown-linux-gnu'

      - name: Build Windows release
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Run compatibility suite
        shell: bash
        run: python scripts/test-lusa.py "${{ matrix.binary }}"

      - name: Stage release filename
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.release_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.release_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lusa-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum lusa-linux-x86_64 lusa-windows-x86_64.exe > SHA256SUMS.txt

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
